# Implement your install deployment tasks here
# -------------------------------------------------

- name: setup rbac  
  import_tasks: setup_rbac.yml

- name: setup keycloak
  import_tasks: setup_keycloak.yml

# prepare for the htpasswd oauth provider

- name: generate htpasswd file
  template:
    src: "htpasswd.j2"
    dest: "roles/setup-auth/files/users.htpasswd"
    owner: "{{ ansible_user_id }}"
    mode: 0664

- name: create htpasswd secret from htpasswd file
  shell: |
    oc create secret generic htpasswd-secret \
      --from-file=htpasswd=roles/setup-auth/files/users.htpasswd \
      -n openshift-config \
      --kubeconfig="$HOME/.kube/{{ cluster_fqn }}"
  register: htpasswd_secret_result
  failed_when:
    - htpasswd_secret_result.rc != 0
    - "'already exists' not in htpasswd_secret_result.stderr"

# configure OAuth

- name: update oauth configuration
  k8s:
    merge_type:
      - strategic-merge
      - merge
    definition: "{{ lookup('template', 'openshift-oauth-config.yml.j2') | from_yaml }}"
    state: present
    kubeconfig: "{{ local_kubeconfig_file }}"

- name: wait for oauth server pods to be ready
  k8s_info:
    api_version: v1
    kind: Pod
    namespace: openshift-authentication
    label_selectors:
      - app=oauth-openshift
    kubeconfig: "{{ local_kubeconfig_file }}"
  register: r_oauth_pods
  retries: 60
  delay: 10
  until:
    - r_oauth_pods.resources | length > 0
    - r_oauth_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == r_oauth_pods.resources | length