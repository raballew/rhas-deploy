# Implement your uninstall deployment tasks here
# -------------------------------------------------

- name: destroy the openshift cluster
  block:
    - name: run openshift-install destroy
      shell: |
        source .env-{{ cluster_fqn }}.sh && \
        ./{{ installer_binary_fqn }} destroy cluster --dir="{{ cluster_metadata_dir }}/{{ cluster_fqn }}"
      args:
        chdir: "{{ openshift_install_dir }}"

    - name: remove cluster specific assets
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "~/.kube/{{ cluster_fqn }}"
        - "{{ cluster_metadata_dir }}/{{ cluster_fqn }}"
        - "{{ cluster_ssh_key_dir }}/{{ cluster_fqn }}"
        - "{{ cluster_ssh_key_dir }}/{{ cluster_fqn }}.pub"
        - "{{ openshift_install_dir }}/.env-{{ cluster_fqn }}.sh"

    - name: remove the installer binary
      when: remove_installer_binary | bool == true
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "{{ openshift_install_dir }}/{{ installer_binary_fqn }}"

  rescue:
    - name: warn about failed cluster destroy
      debug:
        msg: >-
          Cluster destroy failed. Local metadata has been preserved
          to allow retry. Review the error above and re-run the
          destroy playbook after resolving the issue.