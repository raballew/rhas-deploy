# Implement your start tasks here
# -------------------------------------------------

- name: start openshift cluster
  environment:
    GOOGLE_APPLICATION_CREDENTIALS: "{{ gcp_service_account_key_file }}"
  block:
    - name: gather instances in stopped state
      google.cloud.gcp_compute_instance_info:
        project: "{{ gcp_project_id }}"
        zone: "{{ gcp_default_region }}-a"
        filters:
          - name = "{{ cluster_name }}*"
          - status = "TERMINATED"
        auth_kind: serviceaccount
        service_account_file: "{{ gcp_service_account_key_file }}"
      register: gce_instances_a

    - name: gather instances in stopped state (zone b)
      google.cloud.gcp_compute_instance_info:
        project: "{{ gcp_project_id }}"
        zone: "{{ gcp_default_region }}-b"
        filters:
          - name = "{{ cluster_name }}*"
          - status = "TERMINATED"
        auth_kind: serviceaccount
        service_account_file: "{{ gcp_service_account_key_file }}"
      register: gce_instances_b

    - name: gather instances in stopped state (zone f)
      google.cloud.gcp_compute_instance_info:
        project: "{{ gcp_project_id }}"
        zone: "{{ gcp_default_region }}-f"
        filters:
          - name = "{{ cluster_name }}*"
          - status = "TERMINATED"
        auth_kind: serviceaccount
        service_account_file: "{{ gcp_service_account_key_file }}"
      register: gce_instances_f

    - name: combine instances from all zones
      set_fact:
        all_stopped_instances: "{{ (gce_instances_a.resources | default([])) + (gce_instances_b.resources | default([])) + (gce_instances_f.resources | default([])) }}"

    - name: start instances (async)
      google.cloud.gcp_compute_instance:
        name: "{{ item.name }}"
        zone: "{{ item.zone.split('/')[-1] }}"
        project: "{{ gcp_project_id }}"
        status: RUNNING
        auth_kind: serviceaccount
        service_account_file: "{{ gcp_service_account_key_file }}"
      loop: "{{ all_stopped_instances }}"
      when: all_stopped_instances | length > 0
      async: 600
      poll: 0
      register: start_jobs

    - name: wait for all instances to finish starting
      async_status:
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ start_jobs.results | default([]) }}"
      when:
        - all_stopped_instances | length > 0
        - item.ansible_job_id is defined
      register: start_jobs_result
      until: start_jobs_result.finished
      retries: 60
      delay: 10

    - name: verify instances are running
      google.cloud.gcp_compute_instance_info:
        project: "{{ gcp_project_id }}"
        zone: "{{ gcp_default_region }}-{{ item }}"
        filters:
          - name = "{{ cluster_name }}*"
          - status = "TERMINATED"
        auth_kind: serviceaccount
        service_account_file: "{{ gcp_service_account_key_file }}"
      register: stopped_instances_check
      loop: "{{ gcp_zones | default(['a', 'b', 'f']) }}"

    - name: combine stopped instances check from all zones
      set_fact:
        still_stopped_instances: "{{ stopped_instances_check.results | selectattr('resources', 'defined') | map(attribute='resources') | flatten | list }}"

    - name: fail if instances are still stopped
      fail:
        msg: "Some instances are still stopped after start operation: {{ still_stopped_instances | map(attribute='name') | list }}"
      when: still_stopped_instances | length > 0

