# Implement your pre-install deployment tasks here
# -------------------------------------------------

- name: install the devspaces operator
  when: platform_deploy_devspaces | bool == true
  block:
    - name: install devspaces operator
      include_role:
        name: roles/install-operator
      vars:
        operator_name: "devspaces"
        operator_subscription_name: "devspaces"
        subscription_channel: "{{ devspaces_subscription_channel }}"
        subscription_starting_csv: "{{ devspaces_subscription_starting_csv }}"
        operator_deployment_name: "devspaces-operator"
        create_operator_namespace: false
        create_operator_group: false

    - name: wait for devspaces webhook service endpoints to be ready
      k8s_info:
        api_version: v1
        kind: Endpoints
        name: devspaces-operator-service
        namespace: openshift-operators
        kubeconfig: "{{ local_kubeconfig_file }}"
      register: r_webhook_endpoints
      retries: 60
      delay: 10
      until:
        - r_webhook_endpoints.resources | length > 0
        - r_webhook_endpoints.resources[0].subsets is defined
        - r_webhook_endpoints.resources[0].subsets | length > 0
        - r_webhook_endpoints.resources[0].subsets[0].addresses is defined
        - r_webhook_endpoints.resources[0].subsets[0].addresses | length > 0

    - name: wait for devspaces webhook CA bundle to be injected by OLM
      shell: >
        oc get mutatingwebhookconfiguration -o name
        --kubeconfig="{{ local_kubeconfig_file }}" |
        xargs -I{} oc get {} -o jsonpath='{.webhooks[?(@.name=="mchecluster.kb.io")].clientConfig.caBundle}'
        --kubeconfig="{{ local_kubeconfig_file }}"
      register: r_webhook_ca
      retries: 30
      delay: 10
      until:
        - r_webhook_ca.stdout | length > 0
      changed_when: false

- name: install the developer hub operator
  when: platform_deploy_developer_hub | bool == true
  block:
    - name: install developer hub operator
      include_role:
        name: roles/install-operator
      vars:
        operator_name: "rhdh"
        operator_subscription_name: "rhdh"
        subscription_channel: "{{ devhub_subscription_channel }}"
        subscription_starting_csv: "{{ devhub_subscription_starting_csv }}"
        operator_namespace: "rhdh-operator"
        operator_group_name: "rhdh-operator"
        create_operator_namespace: true
        create_operator_group: true