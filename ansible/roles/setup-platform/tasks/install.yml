# platform basics like namespaces, cluster roles, etc.

- name: create rhas bootstrap app
  k8s:
    definition: "{{ lookup('template', item ) | from_yaml }}"
    state: present
    apply: yes
    kubeconfig: "{{ local_kubeconfig_file }}"
  loop:
    - app-project.yml.j2
    - app-platform.yml.j2

- name: wait for the rhas bootstrap app to be ready
  k8s_info:
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: rhas-platform
    namespace: "{{ gitops_namespace }}"
    kubeconfig: "{{ local_kubeconfig_file }}"
  register: r_application
  retries: 180
  delay: 10
  until:
    - r_application.resources | length > 0
    - r_application.resources[0].status is defined
    - r_application.resources[0].status.sync is defined
    - r_application.resources[0].status.sync.status is defined
    - r_application.resources[0].status.sync.status == 'Synced'

# deploy the devspaces application

- name: deploy devspaces app
  when: platform_deploy_devspaces | bool == true
  block:
    # FIXME: this seems to cause issues with the devspaces operator
    #- name: create github oauth config
    #  k8s:
    #    definition: "{{ lookup('template', item ) | from_yaml }}"
    #    state: present
    #    apply: yes
    #    kubeconfig: "{{ local_kubeconfig_file }}"
    #  loop:
    #    - github-oauth-config.yml.j2
    #  when: github_devspaces_client_id is defined and github_devspaces_client_secret is defined

    - name: create rhas devspaces app
      k8s:
        definition: "{{ lookup('template', item ) | from_yaml }}"
        state: present
        apply: yes
        kubeconfig: "{{ local_kubeconfig_file }}"
      loop:
        - app-devspaces.yml.j2

    - name: wait for devspaces namespace to be ready
      k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ platform_devspaces_namespace }}"
        kubeconfig: "{{ local_kubeconfig_file }}"
      register: r_namespace
      retries: 30
      delay: 10
      until:
        - r_namespace.resources | length | int > 0
        - r_namespace.resources[0].status.phase is defined
        - r_namespace.resources[0].status.phase == "Active"

    - name: devspaces config
      k8s:
        definition: "{{ lookup('template', item ) | from_yaml }}"
        state: present
        apply: yes
        kubeconfig: "{{ local_kubeconfig_file }}"
      loop:
        - configmap-devspaces.yml.j2

